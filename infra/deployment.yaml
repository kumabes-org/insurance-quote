apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-quote-api
  labels:
    app: insurance-quote-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: insurance-quote-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: insurance-quote-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: insurance-quote-api
          image: your-registry/insurance-quote-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          # Definição de recursos: Virtual Threads amam CPU para processamento paralelo
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"

          # Health Probes (Requer Spring Boot Actuator)
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"